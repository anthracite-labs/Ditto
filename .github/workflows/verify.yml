# Independent verification of the Ditto engineering foundation.
#
# GitHub runs the same committed gate (scripts/verify.sh) that the agent runs
# locally, so quality never depends on an agent's self-report. See
# docs/decisions/0002-verification-gate.md.
#
# The two job names below are load-bearing: they are the required status
# contexts in config/main-ruleset.json. Renaming a job would leave the default
# branch waiting for a context no longer produced. The ci_wiring check fails if
# the workflow and ruleset disagree, or required execution is made optional.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Foundation gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Ensure shellcheck is present
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version

      - name: Make PyYAML available for the workflow YAML check
        run: python3 -c 'import yaml' 2>/dev/null || pip install --quiet 'pyyaml==6.0.3'

      - name: Run the verification gate
        # AgentShield runs but scans 0 files here (no Claude config surface in
        # an Arena adapter), so the gate reports it as SKIP rather than PASS.
        # It is advisory for this repository, not a security gate. See
        # docs/SECURITY.md.
        env:
          VERIFY_AGENTSHIELD: require
        run: bash scripts/verify.sh

      - name: Run the negative tests (gate must fail when it should)
        run: bash scripts/selftest.sh

  independent-checks:
    name: Independent checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Ensure shellcheck is present
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files -- '*.sh')
          printf 'shellchecking %s script(s)\n' "${#scripts[@]}"
          shellcheck --severity=style "${scripts[@]}"

      - name: Verify executable bits in the git index
        run: |
          set -euo pipefail
          fail=0
          for f in scripts/verify.sh scripts/selftest.sh scripts/bootstrap.sh \
                   scripts/init-project.sh scripts/sync-ecc.sh; do
            mode="$(git ls-files -s -- "$f" | awk '{print $1}')"
            if [ "$mode" != "100755" ]; then
              printf 'not executable in index (mode %s): %s\n' "${mode:-missing}" "$f"
              fail=1
            fi
          done
          exit "$fail"

      - name: Confirm the adapter is labelled an adaptation, not native ECC
        run: |
          set -euo pipefail
          grep -qi 'ECC-on-Arena adapter' AGENTS.md
          grep -qi 'not native ECC' AGENTS.md .ecc/BOOTSTRAP.md README.md
          grep -q 'ADAPTER_NATIVE_ECC_RUNTIME=false' .ecc/VERSION

      - name: Make PyYAML available for structural CI checks
        run: python3 -c 'import yaml' 2>/dev/null || pip install --quiet 'pyyaml==6.0.3'

      - name: Independently validate foundation, lifecycle, provenance and governance
        # Run the actual standalone contracts. Never trust a bare allow flag,
        # a policy string in the wrong JSON location, or another job having run.
        run: bash scripts/verify.sh --only=foundation_version --only=provenance --only=lifecycle --only=no_app_stack --only=ruleset --only=ci_wiring

      - name: Confirm the lifecycle guard is config-driven, not hard-coded
        run: |
          set -euo pipefail
          # The allow flag must live in committed config, not as a constant in
          # the gate. A bare assignment in verify.sh would be a regression.
          if grep -qE '^[[:space:]]*ALLOW_APP_STACK=' scripts/verify.sh; then
            printf 'ALLOW_APP_STACK is hard-coded in scripts/verify.sh\n'
            exit 1
          fi
          grep -qE '^ALLOW_APP_STACK=[01]$' config/project.env
          grep -qE '^PROJECT_PHASE=(discovery|architecture|implementation)$' config/project.env

      - name: Confirm no script performs GitHub administration
        run: |
          set -euo pipefail
          if grep -nE 'gh api .*--method (POST|PUT|PATCH|DELETE)|gh repo edit|git push|curl[^|]*\| *(ba)?sh' scripts/*.sh; then
            printf 'a script performs repository administration or remote execution\n'
            exit 1
          fi
          printf 'no admin API calls, pushes, or curl-pipe-shell in scripts/\n'

      - name: Report foundation surface
        run: |
          set -euo pipefail
          printf 'foundation: %s\n' "$(head -n 1 FOUNDATION_VERSION)"
          printf 'phase:      %s\n' "$(sed -n 's/^PROJECT_PHASE=//p' config/project.env | head -n 1)"
          printf 'rules:      %s\n' "$(git ls-files -- '.ecc/rules/*.md' | wc -l)"
          printf 'skills:     %s\n' "$(git ls-files -- '.ecc/skills/*.md' | wc -l)"
          printf 'roles:      %s\n' "$(git ls-files -- '.ecc/roles/*.md' | wc -l)"
          printf 'adrs:       %s\n' "$(git ls-files -- 'docs/decisions/*.md' | wc -l)"
